# Redocly CLI: `npm run lint:openapi` (pre-push gate, CI) and `npm run docs:api` (the API reference).
# The recommended rules must stay listed: a configuration that names no rules makes the lint check nothing.
# Telemetry off: the CLI would otherwise report every command to Redocly (test/supply-chain/tooling-offline.test.ts).
extends:
  - recommended
telemetry: off
# The API reference (`npm run docs:api`, scripts/build-api-reference.ts) is a static page without Redoc's script:
# everything expanded, and nothing shown that needs the script (search, the download button).
openapi:
  expandResponses: all
  schemaExpansionLevel: all
  jsonSampleExpandLevel: all
  expandSingleSchemaField: true
  hideDownloadButtons: true
  disableSearch: true
