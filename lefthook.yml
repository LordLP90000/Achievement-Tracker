# Git hooks (ADR-0001 as amended): work is pushed straight to master, so checks run before it leaves the machine.
# Install once per clone with `npx lefthook install` (dependency install scripts are disabled, see .npmrc).
# Never bypass with --no-verify.
pre-commit:
  commands:
    secret-scan:
      # Requires gitleaks on PATH (winget install Gitleaks.Gitleaks); a missing scanner blocks the commit.
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}

pre-push:
  commands:
    fast-gates:
      run: npm run -s check
