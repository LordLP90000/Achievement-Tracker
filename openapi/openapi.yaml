openapi: 3.1.0
info:
  title: Questline API
  version: 0.1.0-draft
  summary: Backend API for the Questline mobile achievement-tracking app.
  description: |
    **M0 draft — contract written before implementation.** Enforced by contract tests (ADR-0010).

    Conventions
    - All endpoints except health and the public auth endpoints require `Authorization: Bearer <access token>`.
    - Authenticated responses carry `Cache-Control: no-store`.
    - Errors are RFC 9457 `application/problem+json`; `type` is a URN `urn:questline:problem:<slug>` (ADR-0007).
    - IDs are random UUID v4. Pagination is cursor-based (`cursor`, `limit` ≤ 100).
    - Create endpoints require an `Idempotency-Key` header (UUID). Mutations of versioned resources require
      `If-Match: "<version>"`; a stale version yields `409`.
    - Owner, XP, status transitions to/from `completed`, completion flags and timestamps are never accepted from the client.
    - Unknown request fields are rejected with `400`.
    - Vocabulary: Achievement, Quest, Check-in, XP, level, streak, badge.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder until hosting (Q-01) and domain (Q-19) are decided.
tags:
  - name: health
    description: Liveness/readiness probes (unauthenticated, no internals disclosed).
  - name: auth
    description: Registration, verification, login, token refresh, password reset, re-authentication.
  - name: me
    description: The authenticated account.
  - name: sessions
    description: Device sessions of the account.
  - name: consents
    description: Versioned consents (explicit, unticked, withdrawable).
  - name: achievements
    description: Big goals broken into quests.
  - name: quests
    description: Smaller goals (one_time, habit, target) that earn XP.
  - name: check-ins
    description: Progress entries for quests; undo reverses all effects.
  - name: stats
    description: XP over time, level, badges, streaks.
  - name: privacy
    description: Access/portability export and account deletion.

security:
  - bearerAuth: []

paths:
  # ───────────────────────────── Health (served at the server root, outside /v1) ─────────────
  /health/live:
    servers:
      - url: https://api.example.invalid
    get:
      tags: [health]
      operationId: healthLive
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /health/ready:
    servers:
      - url: https://api.example.invalid
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness probe (database reachable, KEK self-test passed)
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ───────────────────────────── Auth (public, rate-limited) ─────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register with email and password
      description: |
        Always answers `202` with the same body whether or not the email is already registered (R-AUTH-07).
        A new account receives a verification email; an existing account receives a notice instead.
        Password policy: 12–128 characters, no composition rules, blocked if found in the offline breach list.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with a single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Email verified (or token already consumed by this account). }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and create a device session
      description: |
        Invalid email or password → `401 urn:questline:problem:invalid-credentials` with identical body and timing
        whether or not the account exists. A correct password for an unverified account →
        `403 urn:questline:problem:email-not-verified` (only disclosed to someone who knows the password).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token and obtain a new access token
      description: |
        Presenting a refresh token that has already been rotated revokes the whole session (reuse detection,
        R-AUTH-04) and returns `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { $ref: '#/components/schemas/OpaqueToken' }
      responses:
        '200':
          description: New token pair; the previous refresh token is now invalid.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Revoke all sessions of the user, including the current one
      responses:
        '204': { description: All sessions revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/reauth:
    post:
      tags: [auth]
      operationId: reauthenticate
      summary: Re-enter the password to unlock sensitive operations for 10 minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Session marked as recently authenticated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a single-use reset token; revokes all sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: { $ref: '#/components/schemas/OpaqueToken' }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '422': { $ref: '#/components/responses/WeakPassword' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get the authenticated account
      responses:
        '200':
          description: Account.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update nickname, timezone or locale
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [me, privacy]
      operationId: deleteAccount
      summary: Delete the account immediately (hard delete + crypto-shredding)
      description: Requires recent re-authentication (R-AUTH-06). Revokes all sessions, deletes every row of the user, destroys the data key, writes a tombstone (Q-13) and an audit event is **not** retained (nothing of the user remains).
      responses:
        '204': { description: Account deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReauthenticationRequired' }
  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change the password; revokes all other sessions
      description: Requires recent re-authentication (R-AUTH-06) and the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { $ref: '#/components/schemas/Password' }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; other sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/ReauthenticationRequired' }
        '422': { $ref: '#/components/responses/WeakPassword' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/email-change:
    post:
      tags: [me]
      operationId: requestEmailChange
      summary: Start an email change (verification link sent to the new address)
      description: Requires recent re-authentication. Always `202`; if the new address is already registered, its owner is notified instead (no enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_email]
              properties:
                new_email: { $ref: '#/components/schemas/Email' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReauthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/email-change/confirm:
    post:
      tags: [me]
      operationId: confirmEmailChange
      summary: Confirm the new email address with the single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Email changed; a notice was sent to the old address. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List active sessions of the user
      responses:
        '200':
          description: Sessions (active first, newest first). Not paginated — bounded by a per-user session limit.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Revoke one session
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/consents:
    get:
      tags: [consents]
      operationId: listConsents
      summary: List consents (active and withdrawn)
      responses:
        '200':
          description: Consents.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [consents]
      operationId: grantConsent
      summary: Grant a consent (explicit, unticked checkbox in the app)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, version]
              properties:
                type: { $ref: '#/components/schemas/ConsentType' }
                version: { $ref: '#/components/schemas/ConsentVersion' }
      responses:
        '201':
          description: Consent recorded.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/consents/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConsentType' }
    delete:
      tags: [consents]
      operationId: withdrawConsent
      summary: Withdraw a consent
      description: For `goal_content` this deletes all achievements, quests, check-ins, XP events and badges (Q-10). The app must confirm with the user first.
      responses:
        '204': { description: Consent withdrawn and dependent data deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/export:
    get:
      tags: [privacy]
      operationId: exportData
      summary: Export all personal data as JSON (access & portability)
      description: Requires recent re-authentication; limited to 2 per 24 h; audit-logged.
      responses:
        '200':
          description: Export document.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Content-Disposition:
              schema: { type: string, const: 'attachment; filename="questline-export.json"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReauthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/stats:
    get:
      tags: [stats]
      operationId: getStats
      summary: XP over time, level, unlocked achievements, badges, best streaks
      parameters:
        - name: from
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LocalDate' }
          description: 'First local date of the XP series (default: 30 days before `to`).'
        - name: to
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LocalDate' }
          description: 'Last local date (default: today in the account timezone). Range ≤ 366 days.'
      responses:
        '200':
          description: Stats.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Achievements ─────────────────────────────
  /achievements:
    get:
      tags: [achievements]
      operationId: listAchievements
      summary: List achievements (cursor pagination)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AchievementStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of achievements.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [achievements]
      operationId: createAchievement
      summary: Create an achievement
      description: Requires active `goal_content` consent, otherwise `403 urn:questline:problem:consent-required`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Achievement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /achievements/{achievementId}:
    parameters:
      - $ref: '#/components/parameters/AchievementId'
    get:
      tags: [achievements]
      operationId: getAchievement
      summary: Get one achievement with its quests
      responses:
        '200':
          description: Achievement with quests.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [achievements]
      operationId: updateAchievement
      summary: Update an achievement (content, target date, privacy hint, status active/paused/archived)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementUpdate' }
      responses:
        '200':
          description: Updated.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Achievement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [achievements]
      operationId: deleteAchievement
      summary: Delete an achievement, its quests and check-ins; revokes XP earned through it (Q-12)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /achievements/{achievementId}/quests:
    parameters:
      - $ref: '#/components/parameters/AchievementId'
    get:
      tags: [quests]
      operationId: listQuests
      summary: List the quests of an achievement in order (≤ 50, not paginated)
      responses:
        '200':
          description: Quests ordered by `position`.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Quest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [quests]
      operationId: createQuest
      summary: Create a quest in an achievement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Quests ─────────────────────────────
  /quests/{questId}:
    parameters:
      - $ref: '#/components/parameters/QuestId'
    get:
      tags: [quests]
      operationId: getQuest
      summary: Get one quest with progress, lock state and streak
      responses:
        '200':
          description: Quest.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [quests]
      operationId: updateQuest
      summary: Update a quest (type is immutable; progress and XP are recomputed)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestUpdate' }
      responses:
        '200':
          description: Updated quest plus any side effects on XP and the achievement.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Effects' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [quests]
      operationId: deleteQuest
      summary: Delete a quest and its check-ins; revokes XP earned through it (Q-12)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deleted; returns the resulting achievement state and XP delta.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Effects' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /quests/{questId}/check-ins:
    parameters:
      - $ref: '#/components/parameters/QuestId'
    get:
      tags: [check-ins]
      operationId: listCheckIns
      summary: List check-ins of a quest (newest first, cursor pagination)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of check-ins.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [check-ins]
      operationId: createCheckIn
      summary: Record progress on a quest
      description: |
        Rejected with `409 urn:questline:problem:quest-locked` if the prerequisite is not completed,
        `409 urn:questline:problem:achievement-not-active` if the achievement is paused/archived/completed,
        `422` for a future `local_date`, a `local_date` older than 7 days, a missing `value` on a target quest or a
        `value` on a non-target quest. Returns the check-in, the updated quest and achievement and the XP awarded (R-CHK-05).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            Location: { schema: { type: string } }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Check-ins ─────────────────────────────
  /check-ins/{checkInId}:
    parameters:
      - $ref: '#/components/parameters/CheckInId'
    delete:
      tags: [check-ins]
      operationId: undoCheckIn
      summary: Undo a check-in (delete it and reverse all its effects)
      responses:
        '200':
          description: Undone; returns the resulting quest/achievement state and XP delta.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Effects' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token (`ql_at_…`), valid ≤ 15 minutes (ADR-0004).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID v4; same key + same body replays the first response for 24 h.
      schema: { $ref: '#/components/schemas/Uuid' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag of the version the client last saw, e.g. `"3"`.
      schema:
        type: string
        pattern: '^"[0-9]{1,9}"$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Cursor' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AchievementId:
      name: achievementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    QuestId:
      name: questId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CheckInId:
      name: checkInId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

  headers:
    CacheControlNoStore:
      required: true
      schema: { type: string, const: no-store }
    ETag:
      required: true
      description: Quoted resource version, mirrors the `version` field.
      schema: { type: string, pattern: '^"[0-9]{1,9}"$' }
    IdempotencyReplayed:
      required: false
      schema: { type: string, enum: ['true'] }
    RetryAfter:
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Accepted:
      description: Accepted. The body is identical whether or not the account exists (no enumeration).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              message:
                type: string
                const: If the request can be fulfilled, an email has been sent.
    ValidationError:
      description: Request failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Unauthorized:
      description: Missing, expired or revoked access token.
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidCredentials:
      description: Wrong email or password (identical for unknown accounts).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidToken:
      description: Unknown, expired or already-used token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmailNotVerified:
      description: Correct credentials but the email is not verified yet.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ReauthenticationRequired:
      description: The session must re-enter the password (`POST /auth/reauth`) first.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConsentRequired:
      description: Active `goal_content` consent is required.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found — also returned for objects that belong to another user (R-AUTHZ-02).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (e.g. quest locked, achievement not active, consent already granted).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: '`If-Match` does not match the current version.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/VersionConflictProblem' }
    PreconditionRequired:
      description: '`If-Match` header missing.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableContent:
      description: Semantically invalid (business rule violated).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    WeakPassword:
      description: Password too short/long or found in the breach list.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── primitives ──
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC timestamp.
    LocalDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Calendar date in the user's timezone.
    Cursor:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,200}$'
      description: Opaque pagination cursor.
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: Any Unicode; no composition rules (NIST SP 800-63B). Minimum length Q-06.
    OpaqueToken:
      type: string
      pattern: '^ql_[a-z]{2}_[A-Za-z0-9_-]{43}$'
      description: Prefixed opaque token (`ql_at_` access, `ql_rt_` refresh, `ql_vt_` verification, `ql_pt_` password reset).
    Timezone:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA timezone name, e.g. `Europe/Zurich`.
    Locale:
      type: string
      enum: [de-CH, fr-CH, it-CH, en, de, fr, it]
    Nickname:
      type: string
      minLength: 1
      maxLength: 40
    Decimal:
      type: string
      pattern: '^-?[0-9]{1,10}(\.[0-9]{1,3})?$'
      description: Decimal number as a string (≤ 3 fractional digits) to avoid float rounding.
    Progress:
      type: number
      minimum: 0
      maximum: 1
    Version:
      type: integer
      minimum: 1
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }

    # ── problems ──
    Problem:
      type: object
      required: [type, title, status, request_id]
      properties:
        type: { type: string, pattern: '^urn:questline:problem:[a-z0-9-]+$' }
        title: { type: string, maxLength: 120 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 500 }
        instance: { type: string, maxLength: 300 }
        request_id: { $ref: '#/components/schemas/Uuid' }
      additionalProperties: true
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [pointer, message]
                properties:
                  pointer: { type: string, maxLength: 200, description: JSON Pointer into the request body/query. }
                  message: { type: string, maxLength: 200, description: Static message; never echoes the submitted value. }
    VersionConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current_version]
          properties:
            current_version: { $ref: '#/components/schemas/Version' }

    # ── auth ──
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, privacy_policy_version]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        timezone: { $ref: '#/components/schemas/Timezone' }
        locale: { $ref: '#/components/schemas/Locale' }
        privacy_policy_version:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Version of the privacy policy/terms the user accepted (A-14).
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: '#/components/schemas/OpaqueToken' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, client]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        client: { $ref: '#/components/schemas/Client' }
        device_label:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional user-chosen label shown in the session list (Q-09).
    Client:
      type: string
      enum: [ios, android]
    TokenPair:
      type: object
      additionalProperties: false
      required: [token_type, access_token, access_expires_in, refresh_token, refresh_expires_in, session_id]
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { $ref: '#/components/schemas/OpaqueToken' }
        access_expires_in: { type: integer, maximum: 900, description: 'Seconds (≤ 900).' }
        refresh_token: { $ref: '#/components/schemas/OpaqueToken' }
        refresh_expires_in: { type: integer, description: 'Seconds.' }
        session_id: { $ref: '#/components/schemas/Uuid' }

    # ── account ──
    Account:
      type: object
      additionalProperties: false
      required: [id, email, nickname, timezone, locale, email_verified, created_at, xp_total, level, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { $ref: '#/components/schemas/Email' }
        nickname:
          oneOf:
            - $ref: '#/components/schemas/Nickname'
            - type: 'null'
        timezone: { $ref: '#/components/schemas/Timezone' }
        locale: { $ref: '#/components/schemas/Locale' }
        email_verified: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        xp_total: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        version: { $ref: '#/components/schemas/Version' }
    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname:
          oneOf:
            - $ref: '#/components/schemas/Nickname'
            - type: 'null'
        timezone: { $ref: '#/components/schemas/Timezone' }
        locale: { $ref: '#/components/schemas/Locale' }
    Session:
      type: object
      additionalProperties: false
      required: [id, client, device_label, created_at, last_used_at, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        client: { $ref: '#/components/schemas/Client' }
        device_label:
          oneOf:
            - { type: string, maxLength: 64 }
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { $ref: '#/components/schemas/Timestamp' }
        current: { type: boolean, description: True for the session making the request. }
    ConsentType:
      type: string
      enum: [goal_content]
    ConsentVersion:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    Consent:
      type: object
      additionalProperties: false
      required: [type, version, granted_at, withdrawn_at]
      properties:
        type: { $ref: '#/components/schemas/ConsentType' }
        version: { $ref: '#/components/schemas/ConsentVersion' }
        granted_at: { $ref: '#/components/schemas/Timestamp' }
        withdrawn_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    # ── achievements ──
    AchievementStatus:
      type: string
      enum: [active, paused, completed, archived]
    AchievementClientStatus:
      type: string
      enum: [active, paused, archived]
      description: Statuses a client may request; `completed` is system-managed.
    AchievementCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        motivation: { type: string, maxLength: 2000 }
        category: { type: string, maxLength: 60 }
        target_date: { $ref: '#/components/schemas/LocalDate' }
        is_private: { type: boolean, default: false }
    AchievementUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description:
          oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }]
        motivation:
          oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }]
        category:
          oneOf: [{ type: string, maxLength: 60 }, { type: 'null' }]
        target_date:
          oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }]
        is_private: { type: boolean }
        status: { $ref: '#/components/schemas/AchievementClientStatus' }
    Achievement:
      type: object
      additionalProperties: false
      required: [id, title, description, motivation, category, target_date, status, is_private, progress, xp_required_total, xp_earned, completed_at, created_at, updated_at, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 120 }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        motivation: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        category: { oneOf: [{ type: string, maxLength: 60 }, { type: 'null' }] }
        target_date: { oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/AchievementStatus' }
        is_private: { type: boolean }
        progress: { $ref: '#/components/schemas/Progress' }
        xp_required_total: { type: integer, minimum: 0, description: Sum of XP of required quests. }
        xp_earned: { type: integer, minimum: 0, description: XP earned so far through this achievement (quests + bonus). }
        completed_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    AchievementDetail:
      allOf:
        - $ref: '#/components/schemas/Achievement'
        - type: object
          required: [quests]
          properties:
            quests:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/Quest' }
    AchievementPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Achievement' }
        next_cursor:
          oneOf: [{ $ref: '#/components/schemas/Cursor' }, { type: 'null' }]

    # ── quests ──
    QuestType:
      type: string
      enum: [one_time, habit, target]
    QuestSize:
      type: string
      enum: [S, M, L]
      description: XP 10 / 25 / 50.
    HabitPeriod:
      type: string
      enum: [day, week]
    HabitConfig:
      type: object
      additionalProperties: false
      required: [period, times_per_period, period_count]
      properties:
        period: { $ref: '#/components/schemas/HabitPeriod' }
        times_per_period: { type: integer, minimum: 1, maximum: 50 }
        period_count: { type: integer, minimum: 1, maximum: 520 }
        start_date:
          allOf: [{ $ref: '#/components/schemas/LocalDate' }]
          description: Defaults to today in the account timezone.
    TargetConfig:
      type: object
      additionalProperties: false
      required: [start_value, target_value]
      properties:
        start_value: { $ref: '#/components/schemas/Decimal' }
        target_value: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string, maxLength: 20 }
    QuestCreate:
      type: object
      additionalProperties: false
      required: [title, type, size]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
        type: { $ref: '#/components/schemas/QuestType' }
        size: { $ref: '#/components/schemas/QuestSize' }
        is_required: { type: boolean, default: true }
        position: { type: integer, minimum: 0, maximum: 1000, description: Defaults to last. }
        prerequisite_quest_id: { $ref: '#/components/schemas/Uuid' }
        habit: { $ref: '#/components/schemas/HabitConfig' }
        target: { $ref: '#/components/schemas/TargetConfig' }
      description: '`habit` is required iff `type = habit`; `target` is required iff `type = target` (checked semantically → 422).'
    QuestUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        notes: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        size: { $ref: '#/components/schemas/QuestSize' }
        is_required: { type: boolean }
        position: { type: integer, minimum: 0, maximum: 1000 }
        prerequisite_quest_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        habit: { $ref: '#/components/schemas/HabitConfig' }
        target: { $ref: '#/components/schemas/TargetConfig' }
    QuestState:
      type: string
      enum: [locked, available, completed]
    Streak:
      type: object
      additionalProperties: false
      required: [current, best, period]
      properties:
        current: { type: integer, minimum: 0 }
        best: { type: integer, minimum: 0 }
        period: { $ref: '#/components/schemas/HabitPeriod' }
    Quest:
      type: object
      additionalProperties: false
      required: [id, achievement_id, title, notes, type, size, xp, is_required, position, prerequisite_quest_id, state, progress, habit, target, current_value, streak, completed_at, created_at, updated_at, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        achievement_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 120 }
        notes: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        type: { $ref: '#/components/schemas/QuestType' }
        size: { $ref: '#/components/schemas/QuestSize' }
        xp: { type: integer, enum: [10, 25, 50] }
        is_required: { type: boolean }
        position: { type: integer, minimum: 0 }
        prerequisite_quest_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        state: { $ref: '#/components/schemas/QuestState' }
        progress: { $ref: '#/components/schemas/Progress' }
        habit: { oneOf: [{ $ref: '#/components/schemas/HabitConfig' }, { type: 'null' }] }
        target: { oneOf: [{ $ref: '#/components/schemas/TargetConfig' }, { type: 'null' }] }
        current_value: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: Target quests only. }
        streak: { oneOf: [{ $ref: '#/components/schemas/Streak' }, { type: 'null' }], description: Habit quests only. }
        completed_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }

    # ── check-ins ──
    CheckInCreate:
      type: object
      additionalProperties: false
      required: [local_date]
      properties:
        local_date: { $ref: '#/components/schemas/LocalDate' }
        value: { $ref: '#/components/schemas/Decimal' }
        note: { type: string, maxLength: 500 }
    CheckIn:
      type: object
      additionalProperties: false
      required: [id, quest_id, local_date, value, note, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        quest_id: { $ref: '#/components/schemas/Uuid' }
        local_date: { $ref: '#/components/schemas/LocalDate' }
        value: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        note: { oneOf: [{ type: string, maxLength: 500 }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    CheckInPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CheckIn' }
        next_cursor:
          oneOf: [{ $ref: '#/components/schemas/Cursor' }, { type: 'null' }]
    Effects:
      type: object
      additionalProperties: false
      required: [quest, achievement, xp_delta, xp_total, level, achievement_unlocked, achievement_relocked]
      description: Result of a mutation that may change progress, XP and unlock state.
      properties:
        quest: { oneOf: [{ $ref: '#/components/schemas/Quest' }, { type: 'null' }], description: Null when the quest was deleted. }
        achievement: { $ref: '#/components/schemas/Achievement' }
        xp_delta: { type: integer }
        xp_total: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        achievement_unlocked: { type: boolean }
        achievement_relocked: { type: boolean }
    CheckInResult:
      allOf:
        - $ref: '#/components/schemas/Effects'
        - type: object
          required: [check_in]
          properties:
            check_in: { $ref: '#/components/schemas/CheckIn' }

    # ── stats ──
    Stats:
      type: object
      additionalProperties: false
      required: [xp_total, level, xp_to_next_level, xp_by_day, achievements, badges, best_streaks]
      properties:
        xp_total: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        xp_to_next_level: { type: integer, minimum: 0 }
        xp_by_day:
          type: array
          maxItems: 366
          items:
            type: object
            additionalProperties: false
            required: [date, xp]
            properties:
              date: { $ref: '#/components/schemas/LocalDate' }
              xp: { type: integer }
        achievements:
          type: object
          additionalProperties: false
          required: [active, paused, completed, archived]
          properties:
            active: { type: integer, minimum: 0 }
            paused: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            archived: { type: integer, minimum: 0 }
        badges:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, kind, achievement_id, achievement_title, awarded_at]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              kind: { type: string, enum: [achievement_unlocked] }
              achievement_id: { $ref: '#/components/schemas/Uuid' }
              achievement_title: { type: string, maxLength: 120 }
              awarded_at: { $ref: '#/components/schemas/Timestamp' }
        best_streaks:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [quest_id, quest_title, period, best, current]
            properties:
              quest_id: { $ref: '#/components/schemas/Uuid' }
              quest_title: { type: string, maxLength: 120 }
              period: { $ref: '#/components/schemas/HabitPeriod' }
              best: { type: integer, minimum: 0 }
              current: { type: integer, minimum: 0 }

    # ── export ──
    ExportDocument:
      type: object
      required: [format, version, generated_at, account, consents, sessions, achievements, xp_events, badges, audit_events]
      properties:
        format: { type: string, const: questline-export }
        version: { type: integer, const: 1 }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        account: { type: object }
        consents: { type: array, items: { type: object } }
        sessions: { type: array, items: { type: object } }
        achievements: { type: array, items: { type: object } }
        xp_events: { type: array, items: { type: object } }
        badges: { type: array, items: { type: object } }
        audit_events: { type: array, items: { type: object } }
      description: Full shape in docs/data-model.md §6; detailed sub-schemas are added in M4.
